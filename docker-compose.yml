services:
  # PostgreSQL Database for Strapi
  postgres:
    image: postgres:16-alpine
    container_name: 10code-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
      POSTGRES_DB: strapi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - 10code-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Strapi Backend
  strapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 10code-strapi
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      JWT_SECRET: changeme_jwt_secret_key_production
      ADMIN_JWT_SECRET: changeme_admin_jwt_secret_key_production
      APP_KEYS: changeme_app_key1,changeme_app_key2
      API_TOKEN_SALT: changeme_api_token_salt
      TRANSFER_TOKEN_SALT: changeme_transfer_token_salt
      HOST: 0.0.0.0
      PORT: 1337
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "1337:1337"
    networks:
      - 10code-network
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npm install && npm run develop"

  # Astro Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 10code-astro
    restart: unless-stopped
    environment:
      PUBLIC_STRAPI_URL: http://localhost:1337
      STRAPI_URL: http://strapi:1337
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4321:4321"
    networks:
      - 10code-network
    depends_on:
      - strapi
    command: sh -c "npm install && npm run dev -- --host"

networks:
  10code-network:
    driver: bridge

volumes:
  postgres-data:
